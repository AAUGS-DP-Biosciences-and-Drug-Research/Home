name: Build and publish site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the deploy job (main branch) may write.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Cancel superseded pull-request builds, but never a running deploy of main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history, for the "Last updated" dates
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system fonts and libraries for PDF rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-core fonts-noto-color-emoji fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Test citation formatting
        run: python scripts/test_citations.py

      - name: Generate supervisor pages
        run: python scripts/gen_supervisors.py

      - name: Build site
        run: zensical build --strict

      - name: Add "Last updated" dates
        run: python scripts/add_dates.py

      - name: Enrich sitemap with primary images
        run: python scripts/enrich_sitemap_images.py

      - name: Validate discovery and rights metadata
        run: python scripts/check_discovery.py

      - name: Build PDFs
        run: python scripts/build_pdf.py

      # Pull requests: downloadable preview. Main: handed to the deploy job.
      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'site-preview' || 'site' }}
          path: site/
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 1 }}

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site/

      # Deploys the same way as before (gh-pages branch), so the address
      # https://aaugs-dp-biosciences-and-drug-research.github.io/Home/ is unchanged.
      # Third-party action pinned to a commit (v4.1.0), because it receives the write token.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages

